[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP Server with JWT token validation"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.11,<5",
    "pyjwt[crypto]>=2.15.1",
    "httpx>=0.28.0",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "cryptography>=50.0.1",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
